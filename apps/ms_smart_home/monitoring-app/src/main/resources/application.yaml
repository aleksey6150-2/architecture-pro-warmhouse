spring:
  application:
    name: telemetry
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/telemetry}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_JDBC_PASSWORD:postgres}


telemetry:
  sensor:
    url: ${TEMPERATURE_API_URL:http://localhost:8081}

server:
  port: 8082
