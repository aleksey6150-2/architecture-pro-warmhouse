
openapi: 3.0.3
info:
  title: Тёплый дом - Users API
  description: |
    API для управления пользователями системы "Тёплый дом".
    Включает аутентификацию, регистрацию и управление профилями пользователей.
  version: 1.0.0
  contact:
    name: API Support
    email: support@teplyi-dom.ru

servers:
  - url: https://api.teplyi-dom.ru/v1
    description: Production server
  - url: https://staging-api.teplyi-dom.ru/v1
    description: Staging server
  - url: http://localhost:8080/v1
    description: Development server

tags:
  - name: Authentication
    description: Аутентификация и авторизация пользователей
  - name: Users
    description: Управление профилями пользователей

paths:
  # ==================== AUTHENTICATION ====================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Регистрация нового пользователя
      description: Создание новой учётной записи пользователя в системе
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: "ivan.petrov@example.com"
              password: "SecurePass123!"
              firstName: "Иван"
              lastName: "Петров"
              phone: "+79991234567"
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "USER_EXISTS"
                message: "Пользователь с email ivan.petrov@example.com уже зарегистрирован"
                timestamp: "2026-01-08T10:30:00Z"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Вход в систему
      description: Аутентификация пользователя по email и паролю
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "ivan.petrov@example.com"
              password: "SecurePass123!"
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_CREDENTIALS"
                message: "Неверный email или пароль"
                timestamp: "2026-01-08T10:30:00Z"
        '423':
          description: Учётная запись заблокирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Выход из системы
      description: Инвалидация текущего токена доступа
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Успешный выход из системы
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Обновление токена доступа
      description: Получение нового access token с использованием refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Токен успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Недействительный refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/password/reset-request:
    post:
      tags:
        - Authentication
      summary: Запрос на сброс пароля
      description: Отправка ссылки для сброса пароля на email
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
            example:
              email: "ivan.petrov@example.com"
      responses:
        '202':
          description: Запрос принят (ссылка отправлена, если email существует)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Если указанный email зарегистрирован, на него отправлена ссылка для сброса пароля"
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password/reset:
    post:
      tags:
        - Authentication
      summary: Сброс пароля
      description: Установка нового пароля с использованием токена сброса
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Пароль успешно изменён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Пароль успешно изменён"
        '400':
          description: Недействительный или просроченный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== USER PROFILE ====================
  /users/me:
    get:
      tags:
        - Users
      summary: Получение профиля текущего пользователя
      description: Возвращает данные профиля аутентифицированного пользователя
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - Users
      summary: Обновление профиля текущего пользователя
      description: Обновление данных профиля аутентифицированного пользователя
      operationId: updateCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Профиль успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Users
      summary: Удаление учётной записи
      description: Удаление учётной записи текущего пользователя
      operationId: deleteCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  description: Текущий пароль для подтверждения
      responses:
        '204':
          description: Учётная запись удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Неверный пароль подтверждения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/password:
    put:
      tags:
        - Users
      summary: Изменение пароля
      description: Изменение пароля текущего пользователя
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Пароль успешно изменён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Пароль успешно изменён"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Неверный текущий пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/avatar:
    put:
      tags:
        - Users
      summary: Загрузка аватара
      description: Загрузка или обновление аватара пользователя
      operationId: uploadAvatar
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Изображение (JPEG, PNG, max 5MB)
      responses:
        '200':
          description: Аватар успешно загружен
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl:
                    type: string
                    format: uri
                    example: "https://cdn.teplyi-dom.ru/avatars/123e4567-e89b.jpg"
        '400':
          description: Неверный формат или размер файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Users
      summary: Удаление аватара
      description: Удаление аватара текущего пользователя
      operationId: deleteAvatar
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Аватар удалён
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== ADMIN ENDPOINTS ====================
  /users:
    get:
      tags:
        - Users
      summary: Получение списка пользователей (Admin)
      description: Получение списка всех пользователей с пагинацией и фильтрацией
      operationId: getUsers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Номер страницы (начиная с 0)
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Размер страницы
        - name: sort
          in: query
          schema:
            type: string
            enum: [createdAt, email, lastName]
            default: createdAt
          description: Поле для сортировки
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Направление сортировки
        - name: search
          in: query
          schema:
            type: string
          description: Поиск по email, имени или фамилии
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
          description: Фильтр по статусу
        - name: role
          in: query
          schema:
            type: string
            enum: [USER, MANAGER, ADMIN]
          description: Фильтр по роли
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}:
    get:
      tags:
        - Users
      summary: Получение пользователя по ID (Admin)
      description: Получение детальной информации о пользователе
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Users
      summary: Обновление пользователя (Admin)
      description: Частичное обновление данных пользователя администратором
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Users
      summary: Удаление пользователя (Admin)
      description: Удаление учётной записи пользователя администратором
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Пользователь удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/block:
    post:
      tags:
        - Users
      summary: Блокировка пользователя (Admin)
      description: Блокировка учётной записи пользователя
      operationId: blockUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Причина блокировки
                  example: "Нарушение правил использования"
      responses:
        '200':
          description: Пользователь заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/unblock:
    post:
      tags:
        - Users
      summary: Разблокировка пользователя (Admin)
      description: Снятие блокировки с учётной записи пользователя
      operationId: unblockUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Пользователь разблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен авторизации

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: UUID пользователя
      schema:
        type: string
        format: uuid
      example: "123e4567-e89b-12d3-a456-426614174000"

  schemas:
    # ==================== REQUEST SCHEMAS ====================
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Email пользователя (будет использоваться для входа)
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: "Пароль (мин. 8 символов, должен содержать буквы и цифры)"
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: Имя
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Фамилия
        phone:
          type: string
          pattern: '^\+7\d{10}$'
          description: Номер телефона в формате +7XXXXXXXXXX

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token для обновления access token

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          description: Токен сброса пароля из email
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: '^\+7\d{10}$'
        notifications:
          $ref: '#/components/schemas/NotificationSettings'

    AdminUpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [USER, MANAGER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]

    # ==================== RESPONSE SCHEMAS ====================
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: Refresh token для обновления access token
        expiresIn:
          type: integer
          description: Время жизни access token в секундах
          example: 3600
        tokenType:
          type: string
          example: "Bearer"
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
          example: "ivan.petrov@example.com"
        firstName:
          type: string
          example: "Иван"
        lastName:
          type: string
          example: "Петров"
        phone:
          type: string
          example: "+79991234567"
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: "https://cdn.teplyi-dom.ru/avatars/123e4567-e89b.jpg"
        role:
          type: string
          enum: [USER, MANAGER, ADMIN]
          example: "USER"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-08T10:30:00Z"
        notifications:
          $ref: '#/components/schemas/NotificationSettings'

    UserAdmin:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            status:
              type: string
              enum: [ACTIVE, INACTIVE, BLOCKED]
              example: "ACTIVE"
            lastLoginAt:
              type: string
              format: date-time
              nullable: true
            blockedAt:
              type: string
              format: date-time
              nullable: true
            blockReason:
              type: string
              nullable: true
            updatedAt:
              type: string
              format: date-time

    UsersPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserAdmin'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8

    NotificationSettings:
      type: object
      properties:
        emailNotifications:
          type: boolean
          default: true
          description: Получать уведомления по email
        pushNotifications:
          type: boolean
          default: true
          description: Получать push-уведомления
        smsNotifications:
          type: boolean
          default: false
          description: Получать SMS-уведомления

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Код ошибки
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Описание ошибки
          example: "Некорректные данные запроса"
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "email"
              message:
                type: string
                example: "Некорректный формат email"
        timestamp:
          type: string
          format: date-time
          example: "2026-01-08T10:30:00Z"

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "VALIDATION_ERROR"
            message: "Ошибка валидации данных"
            details:
              - field: "email"
                message: "Некорректный формат email"
            timestamp: "2026-01-08T10:30:00Z"

    Unauthorized:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "UNAUTHORIZED"
            message: "Требуется аутентификация"
            timestamp: "2026-01-08T10:30:00Z"

    Forbidden:
      description: Доступ запрещён
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "FORBIDDEN"
            message: "Недостаточно прав для выполнения операции"
            timestamp: "2026-01-08T10:30:00Z"

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "NOT_FOUND"
            message: "Пользователь не найден"
            timestamp: "2026-01-08T10:30:00Z"

    TooManyRequests:
      description: Слишком много запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "RATE_LIMIT_EXCEEDED"
            message: "Превышен лимит запросов. Попробуйте позже."
            timestamp: "2026-01-08T10:30:00Z"
      headers:
        Retry-After:
          schema:
            type: integer
          description: Время ожидания в секундах